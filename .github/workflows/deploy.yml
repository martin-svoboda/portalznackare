name: Deploy Portal Značkaře

on:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # Required for creating GitHub releases
    env:
      SSH_SERVER: 37.235.105.56
      SSH_USER: root
      SSH_PORT: 22
      DEV_PATH: /www/hosting/portalznackare.cz/dev/
      PROD_PATH: /www/hosting/portalznackare.cz/www/
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
      APP_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, iconv, json, pdo, pdo_pgsql, pdo_sqlsrv
          coverage: none
          tools: composer:v2

      - name: Set up Composer cache
        uses: actions/cache@v3
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies (DEV)
        if: env.IS_MAIN == 'true'
        run: |
          composer install --optimize-autoloader --no-scripts --no-interaction
          composer dump-autoload --optimize

      - name: Install Composer dependencies (PROD)
        if: env.IS_TAG == 'true'
        run: |
          composer install --no-dev --optimize-autoloader --no-scripts --no-interaction
          composer dump-autoload --optimize --no-dev

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build frontend assets
        run: |
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Připnutý klíč serveru (ověřeno 2026-09-29, ED25519 SHA256:FJsUqCv78nyKg5RkGpRM58EBtUbfwQSkLkDJwy80Mz8).
          # ssh-keyscan při každém běhu by podvržený server přijal bez varování.
          cat >> ~/.ssh/known_hosts << 'KNOWN_HOSTS'
          37.235.105.56 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMMjoUtXaK/tiDI8Nnl/AymcE7YU8cuuYAjQGLI6/HoR
          37.235.105.56 ssh-rsa 
          KNOWN_HOSTS
          chmod 644 ~/.ssh/known_hosts
          
          # Test SSH connection
          echo "Testing SSH connection..."
          ssh -i ~/.ssh/id_rsa -o BatchMode=yes $SSH_USER@$SSH_SERVER "echo 'SSH connection successful'"

      - name: Deploy to DEV (main branch)
        if: env.IS_MAIN == 'true'
        run: |
          # Sync soubory (bez vendor a node_modules - ty se nainstalují na serveru)
          rsync -av --delete -e "ssh -i ~/.ssh/id_rsa" \
            --exclude=".git" \
            --exclude=".gitignore" \
            --exclude=".github" \
            --exclude="/.ddev" \
            --exclude="/tests" \
            --exclude="/docs" \
            --exclude="/user-docs" \
            --exclude="node_modules" \
            --exclude="var" \
            --exclude=".env.local*" \
            --exclude="README.md" \
            --exclude="Claude.md" \
            --exclude="*.md" \
            --exclude="vendor" \
            --exclude="public/uploads" \
            . $SSH_USER@$SSH_SERVER:$DEV_PATH

          # Remote commands na DEV serveru
          ssh -i ~/.ssh/id_rsa $SSH_USER@$SSH_SERVER << 'EOF'
          set -euxo pipefail
          cd ${{ env.DEV_PATH }}
          
          # Nastav správná oprávnění
          chown -R www-data:www-data .
          find . -type d -exec chmod 755 {} \;
          find . -type f -exec chmod 644 {} \;
          chmod +x bin/console
          
          # Check if composer exists and install if needed
          if ! command -v composer &> /dev/null; then
            echo "Installing Composer..."
            curl -sS https://getcomposer.org/installer | php
            mv composer.phar /usr/local/bin/composer
            chmod +x /usr/local/bin/composer
          fi
          
          # Debug PHP a extensions na serveru
          echo "=== PHP Debug Info ==="
          /usr/bin/php8.3 -v
          echo "=== SQLSRV Extensions Check ==="
          /usr/bin/php8.3 -m | grep -E "(pdo_sqlsrv|sqlsrv)" || echo "No SQLSRV found"
          echo "=== Test MSSQL connection ==="
          /usr/bin/php8.3 -r "echo class_exists('PDO') ? 'PDO: OK' : 'PDO: Missing'; echo PHP_EOL;"
          /usr/bin/php8.3 -r "echo in_array('sqlsrv', PDO::getAvailableDrivers()) ? 'SQLSRV Driver: OK' : 'SQLSRV Driver: Missing'; echo PHP_EOL;" || echo "PDO SQLSRV test failed"
          
          # Set Composer environment variables
          export COMPOSER_ALLOW_SUPERUSER=1
          export COMPOSER_NO_INTERACTION=1
          
          # Composer install na serveru bez spouštění auto-scripts
          composer install --optimize-autoloader --no-scripts --no-interaction
          
          # Zkontroluj že existuje .env.local s DB údaji
          if [ ! -f .env.local ]; then
            echo "❌ Missing .env.local file with database credentials!"
            echo "Please create .env.local on server with:"
            echo "# Internal PostgreSQL database for portal content"
            echo "DATABASE_URL=postgresql://portal_user:password@localhost:5432/portal_db"
            echo "# External MSSQL INSYZ connection"
            echo "USE_TEST_DATA=false"
            echo "INSYZ_DB_HOST=insyz_server"
            echo "INSYZ_DB_NAME=insyz_database"
            echo "INSYZ_DB_USER=insyz_user"
            echo "INSYZ_DB_PASS=insyz_password"
            echo "APP_SECRET=your-secret-here"
            exit 1
          fi
          
          # Vlastník až po composeru (vendor), konzole pak běží jako www-data –
          # jinak by cache vytvořil root a web by do ní nemohl zapisovat (dřív řešeno chmod 777)
          chown -R www-data:www-data .
          CONSOLE="sudo -u www-data /usr/bin/php8.3 bin/console --env=dev"

          # Chyba cache nebo migrací deploy zastaví (set -e)
          $CONSOLE cache:clear
          $CONSOLE doctrine:migrations:migrate --no-interaction --allow-no-migration
          $CONSOLE cache:pool:clear app.api_cache || echo "⚠️ API cache pool not available"

          # Setup/restart Messenger Worker (DEV)
          echo "⚙️ Configuring Messenger Worker (dev)..."
          chmod +x deploy/setup-messenger.sh
          ./deploy/setup-messenger.sh dev

          echo "✅ DEV deployment completed"
          EOF

      - name: Deploy to PROD (tagged release)
        if: env.IS_TAG == 'true'
        run: |
          # Záloha jen toho, co deploy mění a není v repu: databáze (migrace) + .env.local.
          # Kód je v repu, uploady ani var/ deploy nemění. Ponechávají se 2 poslední zálohy.
          # Když dump selže, deploy se zastaví (set -e + pipefail) – bez zálohy se nemigruje.
          ssh -i ~/.ssh/id_rsa $SSH_USER@$SSH_SERVER << 'EOF'
          set -euo pipefail
          cd ${{ env.PROD_PATH }}
          mkdir -p /backup && chmod 700 /backup
          STAMP=$(date +%Y%m%d-%H%M%S)
          # DATABASE_URL z .env.local; parametry Doctrine (?serverVersion=…) pg_dump nezná
          DB_URL=$(grep -E '^DATABASE_URL=' .env.local | tail -1 | cut -d= -f2- | tr -d "\"'")
          pg_dump --no-owner "${DB_URL%%\?*}" | gzip > /backup/portal-znackare-db-$STAMP.sql.gz
          install -m 600 .env.local /backup/portal-znackare-env-$STAMP
          ls -1t /backup/portal-znackare-db-*.sql.gz | tail -n +3 | xargs -r rm --
          ls -1t /backup/portal-znackare-env-* | tail -n +3 | xargs -r rm --
          echo "✅ Záloha DB: /backup/portal-znackare-db-$STAMP.sql.gz"
          EOF

          # Sync soubory na produkci
          rsync -av --delete -e "ssh -i ~/.ssh/id_rsa" \
            --exclude=".git" \
            --exclude=".gitignore" \
            --exclude=".github" \
            --exclude="/.ddev" \
            --exclude="/tests" \
            --exclude="/docs" \
            --exclude="/user-docs" \
            --exclude="node_modules" \
            --exclude="var" \
            --exclude=".env.local*" \
            --exclude="README.md" \
            --exclude="Claude.md" \
            --exclude="*.md" \
            --exclude="vendor" \
            --exclude="public/uploads" \
            . $SSH_USER@$SSH_SERVER:$PROD_PATH

          # Remote commands na PROD serveru
          ssh -i ~/.ssh/id_rsa $SSH_USER@$SSH_SERVER << 'EOF'
          set -euxo pipefail
          cd ${{ env.PROD_PATH }}
          
          # Nastav správná oprávnění
          chown -R www-data:www-data .
          find . -type d -exec chmod 755 {} \;
          find . -type f -exec chmod 644 {} \;
          chmod +x bin/console
          
          # Check if composer exists and install if needed
          if ! command -v composer &> /dev/null; then
            echo "Installing Composer..."
            curl -sS https://getcomposer.org/installer | php
            mv composer.phar /usr/local/bin/composer
            chmod +x /usr/local/bin/composer
          fi
          
          # Set Composer environment variables
          export COMPOSER_ALLOW_SUPERUSER=1
          export COMPOSER_NO_INTERACTION=1
          
          # Composer install na serveru (PROD - bez dev dependencies a bez auto-scripts)
          composer install --no-dev --optimize-autoloader --no-scripts --no-interaction
          
          # Zkontroluj že existuje .env.local s DB údaji
          if [ ! -f .env.local ]; then
            echo "❌ Missing .env.local file with database credentials!"
            echo "Please create .env.local on server with:"
            echo "APP_ENV=prod"
            echo "# Internal PostgreSQL database for portal content"
            echo "DATABASE_URL=postgresql://portal_user:password@localhost:5432/portal_db"
            echo "# External MSSQL INSYZ connection"
            echo "USE_TEST_DATA=false"
            echo "INSYZ_DB_HOST=insyz_server"
            echo "INSYZ_DB_NAME=insyz_database"
            echo "INSYZ_DB_USER=insyz_user"
            echo "INSYZ_DB_PASS=insyz_password"
            echo "APP_SECRET=your-production-secret"
            exit 1
          fi
          
          # Vlastník až po composeru (vendor), konzole pak běží jako www-data –
          # jinak by cache vytvořil root a web by do ní nemohl zapisovat (dřív řešeno chmod 777)
          chown -R www-data:www-data .
          CONSOLE="sudo -u www-data /usr/bin/php8.3 bin/console --env=prod"

          # Chyba cache nebo migrací deploy zastaví (set -e)
          $CONSOLE cache:clear
          $CONSOLE doctrine:migrations:migrate --no-interaction --allow-no-migration
          $CONSOLE cache:warmup

          # Setup/restart Messenger Worker (PROD)
          echo "⚙️ Configuring Messenger Worker (prod)..."
          chmod +x deploy/setup-messenger.sh
          ./deploy/setup-messenger.sh prod

          # Restart PHP-FPM 8.3 (pro portalznackare.cz)
          systemctl reload php8.3-fpm 2>/dev/null || true
          
          echo "✅ PROD deployment completed"
          EOF

      - name: Health check DEV
        if: env.IS_MAIN == 'true'
        env:
          HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
        run: |
          sleep 10
          echo "Testing basic index.php..."
          INDEX_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://dev.portalznackare.cz/ || echo "000")
          echo "Index page returned HTTP $INDEX_CODE"
          
          echo "Testing INSYZ PDO connection..."
          # Tělo odpovědi obsahuje host/DB/uživatele MSSQL – do logu Actions jen HTTP kód a pole "status"
          MSSQL_CODE=$(curl -s -o /tmp/mssql.json -w "%{http_code}" -H "X-Healthcheck-Token: $HEALTHCHECK_TOKEN" https://dev.portalznackare.cz/api/test/mssql-connection || echo "000")
          echo "INSYZ connection test returned HTTP $MSSQL_CODE ($(grep -o '"status":"[a-z_]*"' /tmp/mssql.json 2>/dev/null || echo 'bez status'))"
          rm -f /tmp/mssql.json
          
          # Test API monitoring logs
          echo "Testing API monitoring logs..."
          API_LOG_RESPONSE=$(curl -s -o /dev/null -w "%{time_total}" -H "X-Healthcheck-Token: $HEALTHCHECK_TOKEN" https://dev.portalznackare.cz/api/test/insyz-user || echo "0")
          echo "API response time: ${API_LOG_RESPONSE}s"
          
          if [ "$MSSQL_CODE" != "200" ]; then
            echo "⚠️ INSYZ connection test failed, but continuing deployment"
            
            # Show recent error logs for debugging
            echo "=== Recent error logs ==="
            # dev log rotuje po dnech (var/log/dev-YYYY-MM-DD.log)
            ssh -i ~/.ssh/id_rsa $SSH_USER@$SSH_SERVER "tail -20 \$(ls -1t ${{ env.DEV_PATH }}var/log/dev-*.log 2>/dev/null | head -1) || echo 'No dev log found'"
            # S nastaveným tokenem je neúspěch skutečná chyba – shodit běh (bez tokenu jen varování)
            if [ -n "$HEALTHCHECK_TOKEN" ]; then exit 1; fi
          else
            echo "✅ INSYZ connection test passed"
          fi

      - name: Health check PROD
        if: env.IS_TAG == 'true'
        env:
          HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
        run: |
          sleep 10
          echo "Testing INSYZ PDO connection..."
          # Tělo odpovědi obsahuje host/DB/uživatele MSSQL – do logu Actions jen HTTP kód a pole "status"
          HTTP_CODE=$(curl -s -o /tmp/mssql.json -w "%{http_code}" -H "X-Healthcheck-Token: $HEALTHCHECK_TOKEN" https://portalznackare.cz/api/test/mssql-connection || echo "000")
          echo "INSYZ connection test returned HTTP $HTTP_CODE ($(grep -o '"status":"[a-z_]*"' /tmp/mssql.json 2>/dev/null || echo 'bez status'))"
          rm -f /tmp/mssql.json
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ PROD INSYZ connection test failed, but continuing deployment"
            # Zobraz error log pro debugging
            # PHP chyby jdou na produkci do stderr (error log PHP-FPM), prod.log nevzniká
            ssh -i ~/.ssh/id_rsa $SSH_USER@$SSH_SERVER "tail -20 ${{ env.PROD_PATH }}var/log/api.log 2>/dev/null || echo 'No api.log found'"
            if [ -n "$HEALTHCHECK_TOKEN" ]; then exit 1; fi
          else
            echo "✅ PROD INSYZ connection test passed"
          fi

      - name: Create GitHub Release (only for tag)
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Portal Značkaře ${{ github.ref_name }}"
          body: |
            ## 🚀 Nová verze Portal Značkaře
            
            **Verze:** ${{ github.ref_name }}
            **Datum:** ${{ github.event.head_commit.timestamp }}
            
            ### Změny v této verzi
            ${{ github.event.head_commit.message }}
            
            ### Deployment
            - ✅ Nasazeno na produkci: https://portalznackare.cz
            - ✅ API endpointy ověřeny
            - ✅ Health check prošel
            
            ### API Endpoints
            - `GET /api/test/insyz-user` - Test uživatelských dat
            - `GET /api/test/insyz-prikazy` - Test příkazů

          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa