security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        insyz_provider:
            id: App\Security\InsyzUserProvider
            
    firewalls:
        dev:
            # _profiler/_wdt záměrně NE – jdou přes firewall main a jsou jen pro super admina (viz access_control)
            pattern: ^/(css|images|js)/
            security: false
                
        main:
            pattern: ^/
            lazy: true
            provider: insyz_provider
            custom_authenticator: App\Security\InsyzAuthenticator
            # Deaktivovaný účet (User::isActive) se nepřihlásí
            user_checker: App\Security\UserChecker
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 week
                path: /
                domain: ~
            logout:
                path: /api/auth/logout
                target: /
            # Pro API endpointy vrať JSON odpovědi místo redirectů
            entry_point: App\Security\ApiAuthenticationEntryPoint

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # Symfony profiler (jen dev prostředí) – obsahuje požadavky všech uživatelů, cookies i konfiguraci
        - { path: ^/(_profiler|_wdt), roles: ROLE_SUPER_ADMIN }

        # Public pages
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/prihlaseni, roles: PUBLIC_ACCESS }

        # Public API endpoints
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/status, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/csrf-token$, roles: PUBLIC_ACCESS }
        # Diagnostika – jen admin nebo CI token, ověřuje TestController (CI nemá session)
        - { path: ^/api/test/, roles: PUBLIC_ACCESS }
        # Desktopový klient INSYZ – ověření je v těle requestu, ne session
        - { path: ^/api/insyz-client/db-password$, roles: PUBLIC_ACCESS }

        # Admin pages - require ROLE_ADMIN
        - { path: ^/admin, roles: ROLE_ADMIN }

        # Protected API endpoints - general access
        - { path: ^/api, roles: ROLE_USER }

        # Protected pages - require login
        - { path: ^/prikazy, roles: ROLE_USER }
        # Náhled hlášení přes INSYZ hash – přístup řeší controller (login NEBO platný hash)
        - { path: '^/prikaz/\d+/hlaseni$', roles: PUBLIC_ACCESS }
        - { path: ^/prikaz/, roles: ROLE_USER }
        - { path: ^/profil, roles: ROLE_USER }
        - { path: ^/metodika, roles: ROLE_USER }
        - { path: ^/napoveda, roles: ROLE_USER }
        - { path: ^/downloads, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
