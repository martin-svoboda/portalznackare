# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # INSYZ desktop klient - účty, ke kterým endpoint /api/insyz-client/db-password vydává hesla.
    # Klíč = identifikátor, který posílá klient. Uživatel se ověřuje VŽDY v databázi daného
    # účtu a Portál se do ní přihlašuje tímtéž účtem, takže jediné tajemství je heslo v env.
    # Nový účet = nový blok + nová env proměnná + ověření příkazem "insyz:client:check".
    #
    # Vydávají se výhradně účty "_2" (db_datareader + db_datawriter), které desktopový
    # klient používá pro běžný provoz. Účty bez přípony jsou vlastníci databáze - jejich
    # heslo se nevydává, jinak by měl plná práva na DB každý, kdo má účet v INSYZ.
    insyz_client.accounts:
        db6273_2:
            host: 'sql8.aspone.cz'
            database: 'db6273'
            user: 'db6273_2'
            password: '%env(INSYZ_PWD_DB6273_2)%'
        db6266_2:
            host: 'sql8.aspone.cz'
            database: 'db6266'
            user: 'db6266_2'
            password: '%env(INSYZ_PWD_DB6266_2)%'
        db6285_2:
            host: 'sql8.aspone.cz'
            database: 'db6285'
            user: 'db6285_2'
            password: '%env(INSYZ_PWD_DB6285_2)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $insyzReportHashSecret: '%env(INSYZ_REPORT_HASH_SECRET)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'


    App\Controller\FileServeController:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # API Exception listener pro JSON error responses
    App\EventListener\ApiExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception, priority: 100 }

    # Twig extension pro KČT komponenty
    App\Twig\KctExtension:
        tags:
            - { name: twig.extension }

    # Twig extension pro Tabler ikony
    App\Twig\TablerIconExtension:
        tags:
            - { name: twig.extension }

    # Twig extension pro uživatelské preference
    App\Twig\UserPreferenceExtension:
        tags:
            - { name: twig.extension }

    # Twig extension pro breadcrumbs navigaci
    App\Twig\BreadcrumbsExtension:
        tags:
            - { name: twig.extension }

    # Twig extension pro navigační menu
    App\Twig\MenuExtension:
        tags:
            - { name: twig.extension }

    # Cache services konfigurace
    App\Service\ApiCacheService:
        arguments:
            $cache: '@cache.app'
            $logger: '@monolog.logger.api'

    App\Service\ApiMonitoringService:
        arguments:
            $logger: '@monolog.logger.api'

    # Image processing service konfigurace
    App\Service\ImageProcessingService: ~


    # MSSQL services konfigurace - clean without audit
    # App\Service\MssqlConnector: # uses default autowiring now

    App\Service\InsyzClientCredentialsService:
        arguments:
            $accounts: '%insyz_client.accounts%'

    App\Command\InsyzClientCheckCommand:
        arguments:
            $accounts: '%insyz_client.accounts%'

    App\Service\InsyzClientThrottler:
        arguments:
            $cache: '@cache.app'
            $maxAttempts: 10
            $windowSeconds: 900

    App\Controller\Api\InsyzClientController:
        arguments:
            $logger: '@monolog.logger.api'
            # HTTPS se nevyžaduje jen v lokálním vývoji
            $requireHttps: '%env(bool:INSYZ_CLIENT_REQUIRE_HTTPS)%'
        tags: ['controller.service_arguments']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
